name: Extract & Review Clips
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clips-output
          run-id: 44505663377
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: raw_out
      - name: Extract clips & generate QC report
        run: |
          mkdir -p review/run4
          find raw_out -path "*/edits/*.mp4" -exec cp {} review/run4/ \;
          find raw_out -name "*.md" -exec cp {} review/run4/ \;
          echo "## Candidates" >> $GITHUB_STEP_SUMMARY
          cat review/run4/*.md >> $GITHUB_STEP_SUMMARY || true
          for f in review/run4/*.mp4; do
            base=$(basename "$f" .mp4)
            echo -e "\n## $base" >> $GITHUB_STEP_SUMMARY
            ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 "$f" >> $GITHUB_STEP_SUMMARY
            ffmpeg -i "$f" -vf "blackdetect=d=0.1:pix_th=0.10" -an -f null - 2>&1 | grep blackdetect >> $GITHUB_STEP_SUMMARY || echo "No black frames detected" >> $GITHUB_STEP_SUMMARY
            ffmpeg -y -i "$f" -vframes 1 "review/run4/${base}_frame0.jpg"
            ffmpeg -y -i "$f" -vf "fps=1/3,scale=270:-1,tile=4x4" -frames:v 1 "review/run4/${base}_sheet.jpg"
          done
      - name: Upload small clips-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: clips-only-run4
          path: review/run4/*
      - name: Commit review assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review/run4/*.md review/run4/*.jpg
          git commit -m "Add Run 4 clip review assets" || true
          git push || true
